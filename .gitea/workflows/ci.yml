name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: debian-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 类型检查（渲染进程 + 主进程）
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build
