<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Metona Ollama 主界面（浅色）</title>
  <desc id="desc">展示顶栏、模型选择、聊天气泡、工具卡片与工作空间面板的界面示意图</desc>
  <defs>
    <style>
      .bg { fill: #FAF7F2; }
      .panel { fill: #FFFFFF; stroke: #EADFD2; }
      .text { font-family: Inter, 'Noto Sans SC', system-ui, sans-serif; fill: #2D2016; }
      .muted { fill: #8A7A6A; }
      .accent { fill: #E8734A; }
      .bubble { fill: #FFFFFF; stroke: #EADFD2; }
      .user { fill: #E8734A; }
      .card { fill: #FBF7F1; stroke: #EADFD2; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <rect x="0" y="0" width="220" height="760" class="panel"/>
  <rect x="220" y="0" width="740" height="760" class="bg"/>
  <rect x="960" y="0" width="240" height="760" class="panel"/>

  <text x="24" y="42" class="text" font-size="18" font-weight="700">📋 执行日志</text>
  <rect x="20" y="64" width="180" height="18" rx="6" fill="#F3EDE4"/>
  <rect x="20" y="92" width="150" height="18" rx="6" fill="#F3EDE4"/>
  <rect x="20" y="120" width="172" height="18" rx="6" fill="#F3EDE4"/>

  <text x="248" y="42" class="text" font-size="22" font-weight="800">Metona Ollama</text>
  <rect x="400" y="24" width="70" height="24" rx="12" fill="#E8F5E9"/>
  <text x="414" y="41" font-size="12" class="text" fill="#2E7D32">已连接</text>
  <rect x="640" y="24" width="300" height="34" rx="10" class="card"/>
  <text x="656" y="46" font-size="13" class="text">qwen3.8-flash · 128K · 🔧 Tools</text>

  <rect x="248" y="86" width="520" height="86" rx="14" class="bubble"/>
  <text x="266" y="112" font-size="12" class="muted">AI · qwen3.8-flash</text>
  <text x="266" y="138" font-size="14" class="text">我来读取项目结构并运行测试。</text>
  <rect x="266" y="148" width="180" height="12" rx="6" fill="#F3EDE4"/>

  <rect x="500" y="190" width="340" height="70" rx="14" class="user"/>
  <text x="518" y="216" font-size="12" fill="#FFF4EC">你</text>
  <text x="518" y="242" font-size="14" fill="#FFFFFF">帮我检查 0.18.2 的工具注册表</text>

  <rect x="248" y="278" width="620" height="150" rx="14" class="card"/>
  <text x="266" y="304" font-size="13" class="text" font-weight="700">🔧 工具调用</text>
  <rect x="266" y="318" width="580" height="34" rx="8" fill="#FFFFFF" stroke="#EADFD2"/>
  <text x="278" y="340" font-size="12" class="mono" fill="#2D2016">read_file  {"path":"src/renderer/services/tool-registry.ts"}</text>
  <rect x="266" y="360" width="580" height="34" rx="8" fill="#FFFFFF" stroke="#EADFD2"/>
  <text x="278" y="382" font-size="12" class="mono" fill="#2E7D32">✓ 18 个内置工具 · 0 个旧工具别名</text>
  <rect x="266" y="402" width="220" height="12" rx="6" fill="#F3EDE4"/>

  <rect x="248" y="452" width="620" height="210" rx="14" class="bubble"/>
  <text x="266" y="478" font-size="12" class="muted">AI · 思考中</text>
  <text x="266" y="506" font-size="14" class="text">工具数量严格为 18，Plan Mode 已完全移除。</text>
  <rect x="266" y="522" width="560" height="14" rx="7" fill="#F3EDE4"/>
  <rect x="266" y="546" width="500" height="14" rx="7" fill="#F3EDE4"/>
  <rect x="266" y="570" width="540" height="14" rx="7" fill="#F3EDE4"/>
  <rect x="266" y="606" width="120" height="32" rx="8" class="card"/>
  <text x="284" y="627" font-size="12" class="text">🔊 朗读</text>

  <rect x="248" y="686" width="620" height="48" rx="14" class="bubble"/>
  <text x="266" y="716" font-size="13" class="muted">输入消息…</text>
  <rect x="806" y="696" width="44" height="28" rx="8" class="accent"/>
  <text x="818" y="715" font-size="15" fill="#FFFFFF">➤</text>

  <text x="984" y="42" class="text" font-size="16" font-weight="700">🖥️ 工作空间</text>
  <rect x="980" y="62" width="66" height="26" rx="8" class="accent"/>
  <text x="990" y="80" font-size="11" fill="#FFFFFF">工具</text>
  <rect x="1050" y="62" width="66" height="26" rx="8" class="card"/>
  <text x="1062" y="80" font-size="11" class="text">文件</text>
  <rect x="980" y="104" width="200" height="120" rx="10" class="card"/>
  <text x="994" y="128" font-size="12" class="text">📄 read_file</text>
  <text x="994" y="150" font-size="11" class="muted">success · 32ms</text>
  <rect x="980" y="238" width="200" height="120" rx="10" class="card"/>
  <text x="994" y="262" font-size="12" class="text">🔍 search_files</text>
  <text x="994" y="284" font-size="11" class="muted">12 matches · 18ms</text>
  <rect x="980" y="372" width="200" height="120" rx="10" class="card"/>
  <text x="994" y="396" font-size="12" class="text">💻 run_command</text>
  <text x="994" y="418" font-size="11" class="muted">exit 0 · 2.1s</text>
</svg>
