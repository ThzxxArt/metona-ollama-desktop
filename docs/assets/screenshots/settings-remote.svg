<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">Ollama 远程连接设置</title>
  <desc id="desc">本地/远程下拉、服务地址、API Key、连接测试与远程卸载开关示意</desc>
  <defs>
    <style>
      .bg { fill: #FAF7F2; }
      .modal { fill: #FFFFFF; stroke: #EADFD2; }
      .text { font-family: Inter, 'Noto Sans SC', system-ui, sans-serif; fill: #2D2016; }
      .muted { fill: #8A7A6A; }
      .accent { fill: #E8734A; }
      .input { fill: #FFFFFF; stroke: #DCCFC0; }
      .chip { fill: #FBF7F1; stroke: #EADFD2; }
    </style>
  </defs>
  <rect class="bg" width="1000" height="760"/>
  <rect x="140" y="60" width="720" height="640" rx="20" class="modal"/>
  <text x="176" y="110" font-size="24" font-weight="800" class="text">⚙️ 设置</text>
  <line x1="140" y1="132" x2="860" y2="132" stroke="#EADFD2"/>

  <text x="176" y="170" font-size="14" font-weight="700" class="text">Ollama 连接</text>
  <rect x="176" y="188" width="110" height="42" rx="10" class="chip"/>
  <text x="196" y="214" font-size="14" class="text">远程 ▾</text>
  <rect x="298" y="188" width="526" height="42" rx="10" class="input"/>
  <text x="314" y="214" font-size="13" class="text">https://ollama.com</text>

  <rect x="176" y="244" width="470" height="42" rx="10" class="input"/>
  <text x="192" y="270" font-size="13" class="muted">API Key 已保存（留空保持不变）</text>
  <rect x="658" y="244" width="76" height="42" rx="10" class="chip"/>
  <text x="676" y="270" font-size="12" class="text">显示</text>
  <rect x="744" y="244" width="80" height="42" rx="10" class="chip"/>
  <text x="762" y="270" font-size="12" class="text">清除</text>
  <text x="176" y="308" font-size="11" class="muted">Key 由主进程 safeStorage 加密保存，渲染进程与日志不可见。</text>

  <circle cx="186" cy="340" r="7" fill="#E8734A"/>
  <text x="202" y="345" font-size="13" class="text">Ollama Cloud</text>
  <circle cx="330" cy="340" r="7" fill="#DCCFC0"/>
  <text x="346" y="345" font-size="13" class="text">自建远程</text>
  <rect x="176" y="362" width="648" height="42" rx="10" class="chip"/>
  <text x="192" y="388" font-size="12" class="muted">☁️ Ollama Cloud 模型由服务端管理，不支持本地卸载</text>

  <rect x="176" y="426" width="90" height="30" rx="15" fill="#E8F5E9"/>
  <text x="190" y="446" font-size="12" fill="#2E7D32">✓ 已连接</text>
  <text x="280" y="446" font-size="12" class="muted">v0.40.16 · 42 个模型</text>
  <rect x="176" y="470" width="110" height="38" rx="9" class="chip"/>
  <text x="192" y="494" font-size="12" class="text">测试连接</text>
  <text x="298" y="494" font-size="11" fill="#2E7D32">✓ 401/403、429、TLS 均已分类</text>

  <line x1="176" y1="530" x2="824" y2="530" stroke="#EADFD2"/>
  <text x="176" y="566" font-size="14" font-weight="700" class="text">上下文长度（num_ctx）</text>
  <rect x="176" y="584" width="220" height="42" rx="10" class="input"/>
  <text x="192" y="610" font-size="13" class="text">131072</text>
  <text x="410" y="610" font-size="13" class="muted">≈ 128K</text>
  <text x="176" y="650" font-size="11" class="muted">范围 1K–4M · 实际发送 min(设置值, 模型上限)</text>
</svg>
