name: CI

on:
  push:
    branches: [master, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 格式检查
        run: npm run format:check

      - name: 禁止 temperature 回归
        run: npm run check:no-temperature

      - name: 类型检查（渲染进程 + 主进程）
        run: npm run typecheck

      - name: 单元测试 + 覆盖率
        run: npm run test:coverage

      - name: 构建
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: E2E（xvfb）
        run: xvfb-run -a npm run test:e2e
