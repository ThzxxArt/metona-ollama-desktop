name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: win
          - name: linux-x64
            os: ubuntu-latest
            target: linux
          - name: macos-x64
            os: macos-15-intel
            target: mac
            arch: x64
          - name: macos-arm64
            os: macos-15
            target: mac
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 Windows 安装包
        if: matrix.target == 'win'
        run: npm run dist:win

      - name: 构建 Linux 安装包
        if: matrix.target == 'linux'
        run: npm run dist:linux

      - name: 构建 macOS 安装包
        if: matrix.target == 'mac'
        run: |
          npm run build
          npx electron-builder --mac zip --${{ matrix.arch }}

      - name: 上传 Windows 产物
        if: matrix.target == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: 上传 Linux 产物
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: 上传 macOS 产物
        if: matrix.target == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true

      - name: 生成 SHA256SUMS.txt
        run: |
          cd dist-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            gh release create "$TAG" dist-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag \
              --latest
          fi
